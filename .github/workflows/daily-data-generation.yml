name: Generate Daily API Data

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  generate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Generate today's data
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.DAILY_GENERATION_TOKEN }}" \
            "${{ secrets.RAILWAY_APP_URL }}/api/generate-daily-data"
